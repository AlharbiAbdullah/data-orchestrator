[project]
name = "data-orchestrator"
version = "0.1.0"
description = "End-to-end data pipeline with Dagster orchestration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abdullah Al Harbi", email = "abdullah@example.com" }
]
dependencies = [
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "dagster-dbt>=0.25.0",
    "dbt-duckdb>=1.9.0",
    "duckdb>=1.1.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagster_project"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.dagster]
module_name = "dagster_project.definitions"
