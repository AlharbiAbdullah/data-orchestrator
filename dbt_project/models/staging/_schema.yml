version: 2

models:
  - name: stg_hourly_weather
    description: Staged hourly weather observations
    columns:
      - name: city
        description: City name
        tests:
          - not_null
      - name: observation_timestamp
        description: Observation timestamp
        tests:
          - not_null
      - name: temperature_c
        description: Temperature in Celsius
        tests:
          - not_null

  - name: stg_daily_weather
    description: Staged daily weather aggregates
    columns:
      - name: city
        description: City name
        tests:
          - not_null
      - name: observation_date
        description: Observation date
        tests:
          - not_null
      - name: temp_max_c
        description: Maximum temperature
        tests:
          - not_null
